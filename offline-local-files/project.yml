        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  DuyFilesLocal:
    build:
      targets:
        DuyFilesLocal: all
    archive:
      config: Release
