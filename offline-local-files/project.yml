name: DuyFilesLocal
options:
  bundleIdPrefix: com.duyl6304
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DuyFilesLocal:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duyl6304.DuyFilesLocal
