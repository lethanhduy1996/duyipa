name: Build WQFiles Patch IPA

on:
  push:
    branches:
      - feature/wqfiles-patch
    paths:
      - "patch/**"
      - ".github/workflows/build-wqpatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout patch overlay
        uses: actions/checkout@v4

      - name: Select Xcode 26 and verify iOS SDK
        run: |
          xcode_app=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [[ -z "$xcode_app" ]]; then
            echo "::error::No Xcode 26 installation found on macOS runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcrun --kill-cache
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk_version"
          if [[ "${sdk_version%%.*}" -lt 26 ]]; then
            echo "::error::WQFiles requires iOS SDK 26 or later"
            exit 1
          fi
          xcrun swiftc --version

      - name: Checkout pinned WQFiles source
        run: |
          git clone --no-checkout https://github.com/kolbicz/WQFiles.git upstream
          git -C upstream checkout --detach a8a4d06cbf2651de1cd7bd9f5f8e38f67b025890

      - name: Install WQ Patch overlay
        run: python3 patch/prepare_upstream.py . upstream

      - name: Build IPA
        working-directory: upstream
        run: WQ_SKIP_PREFLIGHT=1 bash build.sh

      - name: Validate IPA ZIP
        run: |
          test -s upstream/WQFiles.ipa
          unzip -tqq upstream/WQFiles.ipa
          unzip -l upstream/WQFiles.ipa | grep -F 'Payload/WQFiles.app/WQFiles'

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-Patch-iOS26-IPA
          path: upstream/WQFiles.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Fast validation of overlay and packaged IPA
        run: |
          python3 -m py_compile patch/prepare_upstream.py
          bash -n upstream/build.sh
          plutil -lint upstream/Info.plist upstream/entitlements.plist
          echo "Note: full upstream host tests run separately; IPA is not device validated"
