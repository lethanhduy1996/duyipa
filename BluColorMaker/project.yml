name: BluColorMaker
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  BluColorMaker:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: WebResources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blu.colormaker
        PRODUCT_NAME: BluColorMaker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blu Color Maker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "4"
    scheme:
      gatherCoverageData: false
